name: Back up trick library

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backup-skills-library
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Export skills_library from Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run niik:backup

      - name: Commit if the library changed
        run: |
          # The .xlsx bytes differ on every run, so only the JSON decides whether to commit.
          if [ -z "$(git status --porcelain -- backups/skills_library.json backups/skills_library_changes.json)" ]; then
            echo "No changes since the last backup."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backups/
          git commit -m "chore: back up trick library $(date -u +%Y-%m-%d)"
          git push
